<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="{{ '/index.html' | relative_url }}">Oshorial Lore Wiki</a>
        <nav class="top-nav">
          <a href="{{ '/locations/index.html' | relative_url }}">Locations</a>
          <a href="{{ '/npcs/index.html' | relative_url }}">NPCs</a>
          <a href="{{ '/players/index.html' | relative_url }}">Players</a>
        </nav>
      </div>
    </header>

    <main class="container content-wrap">
      <article class="content lore-page">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Oshorial Lore Wiki</p>
      </div>
    </footer>
  </body>
</html>
