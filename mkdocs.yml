site_name: Oshorial Lore Wiki
site_description: World lore, locations, NPCs, and player characters for the Oshorial campaign
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Locations:
    - Overview: locations/index.md
    - Oshorial: locations/oshorial.md
    - Drojan Empire:
      - Bracara Augusta: locations/drojan-empire/bracara-augusta.md
      - Greenflower: locations/drojan-empire/greenflower.md
      - Oceanstar: locations/drojan-empire/oceanstar.md
  - NPCs:
    - Overview: npcs/index.md
    - Ukim Thunderfoot: npcs/ukim-thunderfoot.md
  - Player Characters:
    - Overview: players/index.md
    - Player Character Notes: players/player-characters.md
    - Rock Hammerfirst: players/rock-hammerfirst.md

plugins:
  - search

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
